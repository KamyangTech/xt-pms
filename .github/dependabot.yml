# xt-pms Dependabot 配置
# 自动检测并创建依赖更新 PR
# 参考：https://docs.github.com/code-security/dependabot

version: 2
updates:
  # -------- Go 后端依赖 --------
  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "go"
    open-pull-requests-limit: 10

  # -------- npm 前端依赖 --------
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 10
    # 仅更新 patch 和 minor 版本，major 版本手动评估
    versioning-strategy: "increase"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # -------- GitHub Actions 自身 --------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
