# =============================================================================
# Xt-PMS Nginx 站点配置
# =============================================================================
# 复制到 /etc/nginx/sites-available/xt-pms 后启用：
#   sudo ln -s /etc/nginx/sites-available/xt-pms /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/xt-pms-access.log;
    error_log  /var/log/nginx/xt-pms-error.log;

    root /opt/xt-pms/web;
    index index.html;

    # ==================== gzip 压缩 ====================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ==================== 安全屏蔽 ====================
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # 浏览器默认请求的 /favicon.ico 重定向到后端资源
    location = /favicon.ico {
        return 301 /system-assets/logo.svg;
    }

    # ==================== 反向代理 ====================

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:9898;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 上传文件访问
    location /uploads/ {
        proxy_pass http://127.0.0.1:9898;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 系统资源（logo、背景图等）
    location /system-assets/ {
        proxy_pass http://127.0.0.1:9898;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由兜底（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
