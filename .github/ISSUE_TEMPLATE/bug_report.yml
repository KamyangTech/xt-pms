name: Bug 报告
description: 提交 Bug 帮助我们改进产品
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写这个 Bug 报告！

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 请清晰简洁地描述这个 Bug 是什么
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 复现该行为的步骤
      placeholder: |
        1. 打开 '...'
        2. 点击 '....'
        3. 滚动到 '....'
        4. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生的是什么？
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图（可选）
      description: 如果适用，添加截图帮助解释你的问题

  - type: dropdown
    id: component
    attributes:
      label: 影响范围
      description: Bug 发生在哪个部分？
      options:
        - 后端 (server/)
        - 前端 (web/)
        - 数据库 (migrations/)
        - 配置/部署
        - 文档
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 你使用的是哪个版本？
      placeholder: "v0.1.0"

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请提供浏览器/操作系统/Node.js/Go 等信息
      placeholder: |
        - OS: macOS 14
        - Browser: Chrome 120
        - Go: 1.26.1
        - Node: 18.18.0
        - MySQL: 8.0
