# 本地开发 override
# docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml build
# docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
  mysql:
    volumes:
      - mysql-data:/var/lib/mysql
      - ../server/migrations/init_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../server/migrations/init_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
